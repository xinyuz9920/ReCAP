[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-selection"
version = "0.1.0"
description = "ReCAP portable CPU data selection experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.1"]

[tool.setuptools.packages.find]
include = ["recap*"]
